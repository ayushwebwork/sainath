<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sainath Difference</title>

<!-- Bootstrap 5 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<!-- Google Fonts used by the design system -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   DESIGN SYSTEM — reused as-is from the site's existing CSS
   (kept here only so this file is self-contained; in the real
   project this whole block already lives in your global stylesheet
   and does not need to be repeated per page/section).
   ========================================================= */
:root {
  --navy: #1a2e6e;
  --navy-dark: #111e4a;
  --navy-light: #2a3f8f;
  --green: #7ab628;
  --green-dark: #5e9010;
  --green-light: #9dd438;
  --white: #ffffff;
  --off-white: #f7f9fc;
  --gray-100: #f2f4f8;
  --gray-200: #e5e9f0;
  --gray-500: #8899aa;
  --gray-700: #445566;
  --gray-900: #1a2233;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Nunito', sans-serif;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 8px 30px rgba(26,46,110,0.10);
  --shadow-lg: 0 16px 50px rgba(26,46,110,0.16);
  --transition: 0.35s cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; position: relative; }

body{
  font-family: var(--font-body);
  color: var(--gray-900);
  background: var(--white);
  overflow-x: hidden;
  line-height: 1.7;
}

img { max-width: 100%; height: auto; }

.section-pad { padding: 90px 0; }

.section-label{
  display: inline-block;
  font-size: 0.8rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--green);
  background: rgba(122,182,40,0.1);
  padding: 5px 16px;
  border-radius: 50px;
  margin-bottom: 14px;
}

.section-heading{
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 900;
  color: var(--navy);
  line-height: 1.2;
  margin-bottom: 18px;
}
.section-heading span{ color: var(--green); }

.heading-line{
  width: 60px;
  height: 4px;
  background: linear-gradient(90deg, var(--green), var(--navy));
  border-radius: 4px;
  margin-bottom: 20px;
}
.heading-line.mx-auto{ margin-left: auto; margin-right: auto; }

.section-sub{
  font-size: 1.05rem;
  color: var(--gray-500);
  max-width: 560px;
  margin: 0 auto;
}


</style>
</head>
<body>

<!-- ============================================================= -->
<!--  THE SAINATH DIFFERENCE — FEATURE SECTION                      -->
<!-- ============================================================= -->


</body>
</html>
